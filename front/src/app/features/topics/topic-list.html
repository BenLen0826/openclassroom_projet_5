<div class="page">
  <!-- La maquette n'affiche pas de titre (l'en-tête montre « Thèmes ») : lu par les lecteurs d'écran -->
  <h1 class="visually-hidden">Thèmes</h1>

  @if (store.actionError(); as actionError) {
    <p class="field__error" role="alert">{{ actionError }}</p>
  }

  <!-- « Chargement… » seulement à la première visite : ensuite, la liste reste affichée pendant le rafraîchissement -->
  @if (store.loading() && store.topics().length === 0) {
    <p>Chargement…</p>
  } @else if (store.error(); as error) {
    <p class="field__error" role="alert">{{ error }}</p>
  } @else {
    <div class="card-grid">
      @for (topic of store.topics(); track topic.id) {
        <app-topic-card [topic]="topic">
          <button
            type="button"
            class="btn"
            [disabled]="topic.subscribed || store.isPending(topic.id)"
            (click)="store.subscribe(topic.id)"
          >
            {{ topic.subscribed ? 'Déjà abonné' : "S'abonner" }}
          </button>
        </app-topic-card>
      } @empty {
        <p>Aucun thème disponible.</p>
      }
    </div>
  }
</div>
