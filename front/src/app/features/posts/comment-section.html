<section class="comments">
  <h2>Commentaires</h2>

  @if (loadError(); as message) {
    <p class="field__error" role="alert">{{ message }}</p>
  } @else {
    <div class="comments__list">
      @for (comment of comments(); track comment.id) {
        <app-comment-item [comment]="comment" />
      } @empty {
        <p>Aucun commentaire pour l'instant.</p>
      }
    </div>

    <!-- Formulaire seulement si la liste est chargée : sinon un commentaire envoyé resterait invisible -->
    <form class="comments__form" [formGroup]="form" (ngSubmit)="send()" novalidate>
      <div class="comments__input">
        <label for="content" class="visually-hidden">Écrivez ici votre commentaire</label>
        <textarea
          id="content"
          name="content"
          rows="5"
          formControlName="content"
          placeholder="Écrivez ici votre commentaire"
          [attr.aria-describedby]="contentError() ? 'content-error' : null"
        ></textarea>
        <button type="submit" class="icon-btn comments__send" aria-label="Envoyer le commentaire">
          <span class="material-icons-outlined" aria-hidden="true">send</span>
        </button>
      </div>
      @if (contentError(); as message) {
        <p class="field__error" id="content-error">{{ message }}</p>
      }
      @if (generalError(); as message) {
        <p class="field__error" role="alert">{{ message }}</p>
      }
    </form>
  }
</section>
