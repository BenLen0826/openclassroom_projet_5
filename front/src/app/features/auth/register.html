<div class="page auth-page">
  <app-back-link to="/" />
  <!-- Grand logo en mobile seulement : en desktop, l'en-tête l'affiche déjà -->
  <img class="auth-page__logo" src="/assets/logo_p6.png" alt="Logo MDD" />
  <h1>Inscription</h1>

  <form class="form-page" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="username">Nom d'utilisateur</label>
      <input
        id="username"
        name="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        [attr.aria-describedby]="errorFor('username') ? 'username-error' : null"
      />
      @if (errorFor('username'); as message) {
        <p class="field__error" id="username-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-describedby]="errorFor('email') ? 'email-error' : null"
      />
      @if (errorFor('email'); as message) {
        <p class="field__error" id="email-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [attr.aria-describedby]="errorFor('password') ? 'password-error' : null"
      />
      @if (errorFor('password'); as message) {
        <p class="field__error" id="password-error">{{ message }}</p>
      }
    </div>

    @if (generalError(); as message) {
      <p class="field__error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn">S'inscrire</button>
  </form>
</div>
