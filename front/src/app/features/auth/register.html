<h1>Inscription</h1>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div>
    <label for="username">Nom d'utilisateur</label>
    <input
      id="username"
      name="username"
      type="text"
      formControlName="username"
      autocomplete="username"
    />
    @if (errorFor('username'); as message) {
      <p id="username-error">{{ message }}</p>
    }
  </div>

  <div>
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" formControlName="email" autocomplete="email" />
    @if (errorFor('email'); as message) {
      <p id="email-error">{{ message }}</p>
    }
  </div>

  <div>
    <label for="password">Mot de passe</label>
    <input
      id="password"
      name="password"
      type="password"
      formControlName="password"
      autocomplete="new-password"
    />
    @if (errorFor('password'); as message) {
      <p id="password-error">{{ message }}</p>
    }
  </div>

  @if (generalError(); as message) {
    <p role="alert">{{ message }}</p>
  }

  <button type="submit" [disabled]="form.invalid || submitting()">S'inscrire</button>
</form>
