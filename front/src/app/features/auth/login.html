<div class="page auth-page">
  <app-back-link to="/" />
  <!-- Grand logo en mobile seulement : en desktop, l'en-tête l'affiche déjà -->
  <img class="auth-page__logo" src="/assets/logo_p6.png" alt="Logo MDD" />
  <h1>Se connecter</h1>

  <form class="form-page" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="identifier">E-mail ou nom d'utilisateur</label>
      <input
        id="identifier"
        name="identifier"
        type="text"
        formControlName="identifier"
        autocomplete="username"
        [attr.aria-describedby]="errorFor('identifier') ? 'identifier-error' : null"
      />
      @if (errorFor('identifier'); as message) {
        <p class="field__error" id="identifier-error">{{ message }}</p>
      }
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-describedby]="errorFor('password') ? 'password-error' : null"
      />
      @if (errorFor('password'); as message) {
        <p class="field__error" id="password-error">{{ message }}</p>
      }
    </div>

    @if (generalError(); as message) {
      <p class="field__error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn">Se connecter</button>
  </form>
</div>
