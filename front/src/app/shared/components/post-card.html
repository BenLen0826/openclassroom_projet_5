<article class="post-card">
  <!-- Le lien du titre est étendu à toute la carte (voir le SCSS) : la carte entière est cliquable -->
  <a class="post-card__link" [routerLink]="['/posts', post().id]">
    <h2>{{ post().title }}</h2>
  </a>
  <p class="post-card__meta">
    <span>{{ post().createdAt | date: 'dd/MM/yyyy' }}</span>
    <span>{{ post().authorUsername }}</span>
  </p>
  <p class="post-card__excerpt">{{ post().content }}</p>
</article>
