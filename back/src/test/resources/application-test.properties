# Profil "test" : base H2 en mémoire, aucune dépendance à MySQL ni au fichier .env
spring.config.import=

spring.datasource.url=jdbc:h2:mem:mdd;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Valeur factice, uniquement pour les tests
mdd.jwt.secret=test-secret-key-for-unit-tests-only-32-chars-min
