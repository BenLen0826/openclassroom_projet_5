# Profil "e2e" : l'API utilisée par les tests end-to-end Cypress (front/cypress).
# Base H2 en mémoire, vide à chaque démarrage (seuls les thèmes de référence sont insérés) :
# les tests créent leurs propres comptes, articles et commentaires sans toucher à MySQL.
#
# Lancement : ./mvnw spring-boot:test-run   (classe TestMddApiApplication, qui active toujours ce profil)
# Ce fichier est dans les ressources de test : « spring-boot:run » ne le voit pas, même avec
# « -Dspring-boot.run.useTestClasspath=true », et se connecterait à MySQL.
#
# Les valeurs ci-dessous remplacent celles du fichier .env (base de données et clé JWT).

spring.datasource.url=jdbc:h2:mem:mdd-e2e;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Valeur factice, uniquement pour les tests end-to-end
mdd.jwt.secret=e2e-secret-key-for-cypress-tests-only-32-chars-min
