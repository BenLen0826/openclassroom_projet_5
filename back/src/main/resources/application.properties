spring.application.name=mdd-api

# Variables locales lues dans back/.env (non commité, modèle : .env.example).
# Une variable d'environnement définie dans le système reste prioritaire.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# --- Base de données MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mdd}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Schéma généré par l'ORM à partir des entités (MVP interne, pas d'outil de migration)
spring.jpa.hibernate.ddl-auto=update
# Pas de requête SQL déclenchée depuis la vue : les DTO sont construits dans les services
spring.jpa.open-in-view=false

# --- Sécurité (JWT HS256) ---
# Clé secrète d'au moins 32 caractères (256 bits)
mdd.jwt.secret=${JWT_SECRET}
mdd.jwt.expiration=7d

# --- CORS : seule origine autorisée (le front Angular) ---
mdd.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
